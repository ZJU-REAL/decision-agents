    - generic [ref=e426]:
      - paragraph [ref=e427]: Main takeaways
      - blockquote [ref=e428]:
        - paragraph [ref=e429]: "Don’t choose a supervisor by how well it acts. Choose it by how well it judges: ask about each action, after the episode ends, and it can teach what it cannot do."
      - list [ref=e430]:
        - listitem [ref=e431]:
          - generic [ref=e432]: "01"
          - generic [ref=e433]: Actor
          - heading "Actors know the required step but are drawn to the easier one." [level=3] [ref=e435]
          - paragraph [ref=e436]: General reminders don’t prevent the error. When a decision model must act, restructure the goal, e.g. into ordered subgoals, rather than adding instructions to the prompt.
          - generic [ref=e437]:
            - generic [ref=e438]: 14.6% → 77.6%
            - generic [ref=e439]: JEV’s probability on the required step once the easier subgoal is removed
        - listitem [ref=e440]:
          - generic [ref=e441]: "02"
          - generic [ref=e442]: Judge
          - heading "The question sets the granularity of the signal." [level=3] [ref=e444]
          - paragraph [ref=e445]: Asking about the eventual outcome gives every action nearly the same score and largely repeats the outcome reward. Asking about each action’s contribution separates actions within a trajectory.
          - generic [ref=e446]:
            - generic [ref=e447]: 0.05 → 0.36
            - generic [ref=e448]: milestone − no-op gap, Value → Progress
        - listitem [ref=e449]:
          - generic [ref=e450]: "03"
          - generic [ref=e451]:
            - generic [ref=e452]: Judge
            - generic [ref=e453]: Actor
          - heading "Hindsight judgments target the Actor’s own failure." [level=3] [ref=e454]
          - paragraph [ref=e455]: The whole trajectory reveals why prerequisite steps mattered. Use decision models to score actions after an episode ends, as in RL training, not to filter actions online from the prefix.
          - generic [ref=e456]:
            - generic [ref=e457]: 0.20 → 0.76
            - generic [ref=e458]: JEV’s score for “open microwave”, Prefix → Full
        - listitem [ref=e459]:
          - generic [ref=e460]: "04"
          - generic [ref=e461]:
            - generic [ref=e462]: Judge
            - generic [ref=e463]: Teacher
          - heading "Screen Judges before training." [level=3] [ref=e464]
          - paragraph [ref=e465]: Judge measures on recorded trajectories identified the question and context that trained the best policy, at a small fraction of the cost of an RL run. Choose by judging quality, not acting ability.
          - generic [ref=e466]:
            - generic [ref=e467]: 42.9% → 82.9%
            - generic [ref=e468]: JEV as Actor vs. the 1.5B policy it teaches, ALFWorld
        - listitem [ref=e469]:
          - generic [ref=e470]: "05"
          - generic [ref=e471]: Teacher
          - heading "Step-level supervision becomes affordable." [level=3] [ref=e473]
          - paragraph [ref=e474]: No step labels, no learned critic, no Teacher at test time. Decision models judge more accurately and more cheaply than prompted LLMs, and a taught 1.5B policy beats a 7B one trained on outcomes alone.
          - generic [ref=e475]:
            - generic [ref=e476]: $22–30
            - generic [ref=e477]: of JEV queries per training run
