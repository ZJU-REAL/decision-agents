      - paragraph [ref=f1e429]: Main takeaways
      - blockquote [ref=f1e430]:
        - paragraph [ref=f1e431]: "Don’t choose a supervisor by how well it acts. Choose it by how well it judges: ask about each action, after the episode ends, and it can teach what it cannot do."
      - list [ref=f1e432]:
        - listitem [ref=f1e433]:
          - generic [ref=f1e434]: "01"
          - generic [ref=f1e435]: Actor
          - heading "Actors know the required step but are drawn to the easier one." [level=3] [ref=f1e437]
          - paragraph [ref=f1e438]: General reminders don’t prevent the error. When a decision model must act, restructure the goal, e.g. into ordered subgoals, rather than adding instructions to the prompt.
          - generic [ref=f1e439]:
            - generic [ref=f1e440]: 14.6% → 77.6%
            - generic [ref=f1e441]: JEV’s probability on the required step once the easier subgoal is removed
        - listitem [ref=f1e442]:
          - generic [ref=f1e443]: "02"
          - generic [ref=f1e444]: Judge
          - heading "The question sets the granularity of the signal." [level=3] [ref=f1e446]
          - paragraph [ref=f1e447]: Asking about the eventual outcome gives every action nearly the same score and largely repeats the outcome reward. Asking about each action’s contribution separates actions within a trajectory.
