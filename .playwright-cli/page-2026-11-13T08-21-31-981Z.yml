            - generic [ref=f1e455]: Actor
          - heading "Hindsight judgments target the Actor’s own failure." [level=3] [ref=f1e456]
          - paragraph [ref=f1e457]: The whole trajectory reveals why prerequisite steps mattered. Use decision models to score actions after an episode ends, as in RL training, not to filter actions online from the prefix.
