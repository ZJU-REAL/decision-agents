      - paragraph [ref=f2e428]: Main takeaways
      - blockquote [ref=f2e429]:
        - paragraph [ref=f2e430]: "Don’t choose a supervisor by how well it acts. Choose it by how well it judges: ask about each action, after the episode ends, and it can teach what it cannot do."
      - list [ref=f2e431]:
