          - heading "Hindsight judgments target the Actor’s own failure." [level=3] [ref=f2e455]
          - paragraph [ref=f2e456]: The whole trajectory reveals why prerequisite steps mattered. Use decision models to score actions after an episode ends, as in RL training, not to filter actions online from the prefix.
