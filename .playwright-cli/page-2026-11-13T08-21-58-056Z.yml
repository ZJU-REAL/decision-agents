          - generic [ref=f2e434]: Actor
          - heading "Actors know the required step but are drawn to the easier one." [level=3] [ref=f2e436]
          - paragraph [ref=f2e437]: General reminders don’t prevent the error. When a decision model must act, restructure the goal, e.g. into ordered subgoals, rather than adding instructions to the prompt.
          - generic [ref=f2e438]:
            - generic [ref=f2e439]: 14.6% → 77.6%
            - generic [ref=f2e440]: JEV’s probability on the required step once the easier subgoal is removed
        - listitem [ref=f2e441]:
