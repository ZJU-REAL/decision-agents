          - generic [ref=f2e443]: Judge
          - heading "The question sets the granularity of the signal." [level=3] [ref=f2e445]
          - paragraph [ref=f2e446]: Asking about the eventual outcome gives every action nearly the same score and largely repeats the outcome reward. Asking about each action’s contribution separates actions within a trajectory.
